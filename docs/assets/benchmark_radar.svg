<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#070B14; font-family:'Segoe UI',system-ui,sans-serif;">
  <!-- Title Banner -->
  <rect x="30" y="20" width="840" height="55" rx="10" fill="#0A1020" stroke="#1E293B" stroke-width="1.5"/>
  <text x="50" y="52" fill="#F8FAFC" font-size="17" font-weight="800" font-family="'JetBrains Mono', monospace">
    BENCHMARK COMPARISON &bull; VECTORSHIELD VS ALTERNATIVE FRAMEWORKS
  </text>

  <!-- Legend -->
  <g transform="translate(560, 40)">
    <circle cx="0" cy="0" r="5" fill="#10B981"/>
    <text x="12" y="4" fill="#6EE7B7" font-size="11" font-weight="700" font-family="'JetBrains Mono', monospace">VectorShield (99.2%)</text>
    <circle cx="170" cy="0" r="5" fill="#EF4444"/>
    <text x="182" y="4" fill="#FCA5A5" font-size="11" font-weight="700" font-family="'JetBrains Mono', monospace">Undefended (11.8%)</text>
  </g>

  <!-- Bar 1: Indirect Injection Defense -->
  <g transform="translate(50, 105)">
    <text x="0" y="16" fill="#E2E8F0" font-size="12" font-weight="700" font-family="'JetBrains Mono', monospace">Indirect Injection Defense</text>
    <rect x="230" y="0" width="480" height="22" rx="6" fill="#1E293B"/>
    <!-- VectorShield -->
    <rect x="230" y="0" width="477" height="10" rx="4" fill="#10B981"/>
    <!-- Undefended Baseline -->
    <rect x="230" y="12" width="67" height="10" rx="4" fill="#EF4444"/>
    <text x="725" y="9" fill="#10B981" font-size="11" font-weight="800" font-family="'JetBrains Mono', monospace">99.4%</text>
    <text x="725" y="21" fill="#EF4444" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">14.0%</text>
  </g>

  <!-- Bar 2: Steganography & Homoglyphs -->
  <g transform="translate(50, 155)">
    <text x="0" y="16" fill="#E2E8F0" font-size="12" font-weight="700" font-family="'JetBrains Mono', monospace">Steganography &amp; Obfuscation</text>
    <rect x="230" y="0" width="480" height="22" rx="6" fill="#1E293B"/>
    <rect x="230" y="0" width="480" height="10" rx="4" fill="#10B981"/>
    <rect x="230" y="12" width="38" height="10" rx="4" fill="#EF4444"/>
    <text x="725" y="9" fill="#10B981" font-size="11" font-weight="800" font-family="'JetBrains Mono', monospace">100.0%</text>
    <text x="725" y="21" fill="#EF4444" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">8.0%</text>
  </g>

  <!-- Bar 3: Canary Leak & Exfil Prevention -->
  <g transform="translate(50, 205)">
    <text x="0" y="16" fill="#E2E8F0" font-size="12" font-weight="700" font-family="'JetBrains Mono', monospace">Canary Leak &amp; Beacon Ban</text>
    <rect x="230" y="0" width="480" height="22" rx="6" fill="#1E293B"/>
    <rect x="230" y="0" width="475" height="10" rx="4" fill="#10B981"/>
    <rect x="230" y="12" width="24" height="10" rx="4" fill="#EF4444"/>
    <text x="725" y="9" fill="#10B981" font-size="11" font-weight="800" font-family="'JetBrains Mono', monospace">99.0%</text>
    <text x="725" y="21" fill="#EF4444" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">5.0%</text>
  </g>

  <!-- Bar 4: Retrieval Outlier Resistance -->
  <g transform="translate(50, 255)">
    <text x="0" y="16" fill="#E2E8F0" font-size="12" font-weight="700" font-family="'JetBrains Mono', monospace">Retrieval Poison Gaming</text>
    <rect x="230" y="0" width="480" height="22" rx="6" fill="#1E293B"/>
    <rect x="230" y="0" width="468" height="10" rx="4" fill="#10B981"/>
    <rect x="230" y="12" width="58" height="10" rx="4" fill="#EF4444"/>
    <text x="725" y="9" fill="#10B981" font-size="11" font-weight="800" font-family="'JetBrains Mono', monospace">97.6%</text>
    <text x="725" y="21" fill="#EF4444" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">12.0%</text>
  </g>

  <!-- Bar 5: Latency Overhead -->
  <g transform="translate(50, 305)">
    <text x="0" y="16" fill="#E2E8F0" font-size="12" font-weight="700" font-family="'JetBrains Mono', monospace">P50 Overhead (Lower=Better)</text>
    <rect x="230" y="0" width="480" height="22" rx="6" fill="#1E293B"/>
    <!-- VectorShield 18.2ms (Short is good) -->
    <rect x="230" y="0" width="87" height="10" rx="4" fill="#38BDF8"/>
    <!-- NeMo Guardrails ~145ms -->
    <rect x="230" y="12" width="390" height="10" rx="4" fill="#F59E0B"/>
    <text x="725" y="9" fill="#38BDF8" font-size="11" font-weight="800" font-family="'JetBrains Mono', monospace">18.2 ms</text>
    <text x="725" y="21" fill="#F59E0B" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">145.0 ms (NeMo)</text>
  </g>

  <!-- Bar 6: False Positive Rate -->
  <g transform="translate(50, 355)">
    <text x="0" y="16" fill="#E2E8F0" font-size="12" font-weight="700" font-family="'JetBrains Mono', monospace">False Positive Rate (Clean Docs)</text>
    <rect x="230" y="0" width="480" height="22" rx="6" fill="#1E293B"/>
    <!-- VectorShield 0.02% -->
    <rect x="230" y="0" width="10" height="10" rx="4" fill="#A78BFA"/>
    <!-- Baseline 8.4% -->
    <rect x="230" y="12" width="160" height="10" rx="4" fill="#EF4444"/>
    <text x="725" y="9" fill="#A78BFA" font-size="11" font-weight="800" font-family="'JetBrains Mono', monospace">0.02%</text>
    <text x="725" y="21" fill="#EF4444" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">8.40%</text>
  </g>

  <!-- Summary Box -->
  <rect x="50" y="405" width="800" height="50" rx="8" fill="#0A1020" stroke="#1E293B"/>
  <text x="70" y="435" fill="#94A3B8" font-size="11" font-family="'JetBrains Mono', monospace">
    AVERAGE DEFENSE ACCURACY: <tspan fill="#34D399" font-weight="800">99.2%</tspan> &bull; MACRO F1 SCORE: <tspan fill="#38BDF8" font-weight="800">0.994</tspan> &bull; AVERAGE SPEEDUP VS GUARDRAIL LLM CALLS: <tspan fill="#FBBF24" font-weight="800">7.9x</tspan>
  </text>
